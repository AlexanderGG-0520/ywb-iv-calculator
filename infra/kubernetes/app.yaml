apiVersion: apps/v1
kind: Deployment
metadata:
  name: ywb-iv-calculator
  labels:
    app.kubernetes.io/name: ywb-iv-calculator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ywb-iv-calculator
  template:
    metadata:
      labels:
        app: ywb-iv-calculator
        app.kubernetes.io/name: ywb-iv-calculator
    spec:
      containers:
        - name: web
          image: ghcr.io/alexandergg-0520/ywb-iv-calculator:main
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
        - name: mcp
          image: ghcr.io/alexandergg-0520/ywb-iv-calculator-mcp:main
          ports:
            - name: mcp
              containerPort: 3001
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ywb-iv-calculator
  labels:
    app.kubernetes.io/name: ywb-iv-calculator
spec:
  type: ClusterIP
  selector:
    app: ywb-iv-calculator
  ports:
    - name: http
      port: 80
      targetPort: http
