name: CI
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - "infra/kubernetes/app.yaml"
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test scripts/update-gitops-image.test.mjs
      - run: npm run build
      - run: npm run build:mcp
