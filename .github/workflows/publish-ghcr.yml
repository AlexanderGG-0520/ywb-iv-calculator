name: Publish GHCR and update GitOps

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths-ignore:
      - "infra/kubernetes/app.yaml"
  workflow_dispatch:

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Test IV logic
        run: npm test
      - name: Test GitOps image updater
        run: node --test scripts/update-gitops-image.node-test.mjs
      - name: Build web
        run: npm run build
      - name: Build remote MCP
        run: npm run build:mcp

      - name: Prepare lowercase GHCR names
        id: image
        shell: bash
        run: |
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "mcp=ghcr.io/${GITHUB_REPOSITORY,,}-mcp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Web image metadata
        id: web-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.web }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
      - name: Publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=ywb-web
          cache-to: type=gha,mode=max,scope=ywb-web

      - name: MCP image metadata
        id: mcp-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.mcp }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
      - name: Publish MCP image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.mcp
          push: true
          tags: ${{ steps.mcp-meta.outputs.tags }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: type=gha,scope=ywb-mcp
          cache-to: type=gha,mode=max,scope=ywb-mcp

  update-gitops:
    needs: test-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm that the revision is still current
        id: current
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [[ "$current" != "$IMAGE_SHA" ]]; then
            echo "main advanced to $current; not updating old revision $IMAGE_SHA"
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin web and MCP image tags to published SHA
        if: steps.current.outputs.active == 'true'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: node scripts/update-gitops-image.mjs "$IMAGE_SHA"

      - name: Commit deployment revision
        if: steps.current.outputs.active == 'true'
        shell: bash
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet -- infra/kubernetes/app.yaml; then
            echo "Both images already reference $IMAGE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/kubernetes/app.yaml
          git commit -m "chore(deploy): ywb-iv-calculator ${IMAGE_SHA:0:12} [skip ci]"
          git push origin HEAD:main
